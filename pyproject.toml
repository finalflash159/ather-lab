[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ather-exploration"
version = "0.1.0"
description = "Partial-observation exploration built on official MiniGrid"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3", "gymnasium==1.3.0", "pygame-ce>=2.4,<3",
  "pydantic>=2.10,<3", "PyYAML>=6,<7",
]

[project.optional-dependencies]
cpu = [
    "torch==2.11.0",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "tensorboard>=2.19,<3",
    "pygame_gui>=0.6,<0.7",
    "wandb>=0.19,<1",
]
cuda = [
    "torch==2.11.0",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "tensorboard>=2.19,<3",
    "modal>=1,<2",
    "wandb>=0.19,<1",
]
ui = ["pygame_gui>=0.6,<0.7"]
wfc = ["networkx", "imageio>=2.31.1"]
modal = [
    "modal>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-mock>=3.10", "hypothesis>=6,<7", "ruff>=0.12", "build>=1,<2", "pyinstaller>=6,<7", "matplotlib>=3.9,<4"]

[project.scripts]
ather-exploration = "ather_exploration.__main__:main"

[tool.setuptools.packages.find]
include = ["minigrid*", "ather_exploration*"]

[tool.setuptools.package-data]
ather_exploration = ["resources/presets/*.yaml", "resources/fixtures/*.json", "resources/training/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
include = ["ather_exploration/**/*.py", "tests/**/*.py"]
line-length = 100

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"},
  {index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
