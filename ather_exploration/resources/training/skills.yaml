# Full P1-P5 curriculum. Train only with explicit train command.
method: ppo
seed: 0
total_timesteps: 4063232
n_envs: 4
n_steps: 256
batch_size: 256
n_epochs: 4
learning_rate: 0.0003
final_learning_rate: 0.00003
device: cpu
vec_backend: subproc
torch_threads: 1
checkpoint_updates: 16
trace_every: 0
skills:
  enabled: true
  stop_after: P5
  train_count: 256
  validation_count: 64
  eval_interval: 16384
  activation: 0.5
  death: 2.0
  first_visit: false
  wall_mask: false
  # Active P1a/P1b only. Later phases reuse easy maps with their own rules.
  p1_reward:
    area: 0.0
    discovery: 0.0
    activation: 0.5
    step_cost: 0.01
  # Pilot defaults; P2a suppresses area/discovery; P2b suppresses area after sighting.
  p2c_horizon: 192
  p2_task_budget: 262144
  p2_gates:
    discovery_success: 0.95
    approach_efficiency: 0.60
    coverage: 0.75
    coverage_auc: 0.50
  p2_reward:
    area: 0.01
    discovery: 0.05
    activation: 0.5
    step_cost: 0.005
    wall_penalty: 0.02
banks:
  small: ../../../artifacts/banks-skills/small
  medium: ../../../artifacts/banks-skills/medium
  large: ../../../artifacts/banks-skills/large
tracking:
  mode: online
  project: ather-exploration
